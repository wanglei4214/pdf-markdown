services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf2md-app
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/tasks.db
      DATA_DIR: /app/data
      # OCR 并发槽位数，默认 1（串行）。不建议在同进程内调大。
      OCR_MAX_CONCURRENCY: "1"
      # Google 登录：Google Cloud Console 中创建 OAuth 2.0 Client ID（Web application）
      # Client ID 是公开值（前端也会用到），可作为默认值写在这里
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-724994158367-9cva8vq6o80cfitkfut7fcis64d7hhde.apps.googleusercontent.com}"
      # Session cookie 签名密钥，必须在 .env 中注入随机值，未设置则容器拒绝启动
      # 生成方法：python -c "import secrets;print(secrets.token_urlsafe(48))"
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?请在 .env 文件中设置 SESSION_SECRET_KEY}"
      # 生产环境走 HTTPS（nginx 终止 TLS）时设为 true，本地 http 开发保持 false
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # Creem 支付：Dashboard → Developers 获取；未配置时前端不显示付费按钮
      CREEM_API_KEY: "${CREEM_API_KEY:-}"
      CREEM_WEBHOOK_SECRET: "${CREEM_WEBHOOK_SECRET:-}"
      CREEM_PRODUCT_ID: "${CREEM_PRODUCT_ID:-}"
      # true=测试环境(test-api.creem.io)，正式上线设为 false
      CREEM_TEST_MODE: "${CREEM_TEST_MODE:-true}"
    volumes:
      - ./tasks.db:/app/data/tasks.db
      - ./uploads:/app/data/uploads
      - ./outputs:/app/data/outputs
      - ./logs:/app/data/logs
    # 内存上限：防止 OCR 并发/大文件导致进程内存失控被宿主机 OOM 杀死。
    # 可通过环境变量 APP_MEMORY_LIMIT 调整，默认 4g（docker compose up 下同样生效）。
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-4g}
    logging:
      driver: json-file
      options:
        max-size: "10m"   # 单个 stdout 日志文件上限 10MB
        max-file: "5"     # 最多保留 5 个，防止日志撑满磁盘

  nginx:
    image: nginx:1.27-alpine
    container_name: pdf2md-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro
      # nginx 访问/错误日志映射到宿主机当前目录 logs/nginx
      - ./logs/nginx:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot
    container_name: pdf2md-certbot
    profiles: ["cert"]  # 默认不启动
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/html:/var/www/html
      - /var/log/letsencrypt:/var/log/letsencrypt
    command: renew --quiet --keep-until-expiring
