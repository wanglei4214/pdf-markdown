name: Deploy

on:
  push:
    branches: [google]
  workflow_dispatch:
    inputs:
      rebuild:
        description: '强制重建后端镜像'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deploy credentials
        id: cfg
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 SSH_PRIVATE_KEY / SSH_HOST secrets，本次仅做检查不部署。配置步骤见 seo/SECRETS-SETUP.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect backend changes
        if: steps.cfg.outputs.configured == 'true'
        id: rebuild
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild }}
        run: |
          if [ "$FORCED" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${BEFORE:-HEAD~1}"
          if git diff --name-only "$BASE" HEAD 2>/dev/null \
             | grep -qE '^(main\.py|models\.py|ocr_engine\.py|requirements\.txt|Dockerfile|docker-compose\.yml|nginx.*\.conf)$'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/deploy
        if: steps.cfg.outputs.configured == 'true'
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-host: ${{ secrets.SSH_HOST }}
          rebuild: ${{ steps.rebuild.outputs.needed == 'true' }}
          indexnow-key: ${{ secrets.INDEXNOW_KEY }}
